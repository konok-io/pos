<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0F766E"/>
      <stop offset="100%" style="stop-color:#14B8A6"/>
    </linearGradient>
  </defs>
  <!-- Background -->
  <rect width="512" height="512" rx="100" fill="url(#bg)"/>
  <!-- Store/Shop Building -->
  <rect x="100" y="200" width="312" height="240" rx="10" fill="#FFFFFF"/>
  <!-- Awning -->
  <path d="M70 200 L256 120 L442 200 Z" fill="#F59E0B"/>
  <path d="M70 200 L256 120 L442 200" stroke="#D97706" stroke-width="4" fill="none"/>
  <!-- Awning stripes -->
  <line x1="130" y1="200" x2="256" y2="145" stroke="#D97706" stroke-width="3"/>
  <line x1="190" y1="200" x2="256" y2="170" stroke="#D97706" stroke-width="3"/>
  <line x1="322" y1="200" x2="256" y2="170" stroke="#D97706" stroke-width="3"/>
  <line x1="382" y1="200" x2="256" y2="145" stroke="#D97706" stroke-width="3"/>
  <!-- Door -->
  <rect x="216" y="320" width="80" height="120" rx="5" fill="#0F766E"/>
  <circle cx="285" cy="380" r="6" fill="#FFD700"/>
  <!-- Windows -->
  <rect x="130" y="250" width="60" height="50" rx="5" fill="#93C5FD"/>
  <rect x="322" y="250" width="60" height="50" rx="5" fill="#93C5FD"/>
  <!-- POS Sign -->
  <rect x="176" y="140" width="160" height="45" rx="8" fill="#FFFFFF"/>
  <text x="256" y="172" font-family="Arial, sans-serif" font-size="24" font-weight="bold" fill="#0F766E" text-anchor="middle">POS</text>
  <!-- Cash Register -->
  <rect x="360" y="340" width="40" height="50" rx="5" fill="#374151"/>
  <rect x="355" y="330" width="50" height="15" rx="3" fill="#1F2937"/>
  <rect x="365" y="350" width="30" height="20" rx="2" fill="#10B981"/>
</svg>
