<!DOCTYPE html>
<html lang="bn">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#1a1a2e">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <title>POS - আল্টিমেট</title>
  <link href="https://fonts.googleapis.com/css2?family=Hind+Siliguri:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    :root {
      --primary: #e94560;
      --secondary: #0f3460;
      --success: #22c55e;
      --warning: #f59e0b;
      --danger: #ef4444;
      --bg: #1a1a2e;
      --card: #16213e;
      --border: #374151;
    }
    body {
      font-family: 'Hind Siliguri', sans-serif;
      background: var(--bg);
      color: #fff;
      min-height: 100vh;
    }
    
    /* Header */
    .header {
      background: var(--card);
      padding: 1rem 1.5rem;
      display: flex;
      justify-content: space-between;
      align-items: center;
      border-bottom: 1px solid var(--border);
      position: sticky;
      top: 0;
      z-index: 100;
    }
    .logo { font-size: 1.5rem; font-weight: bold; color: var(--primary); }
    .status { 
      display: flex; 
      align-items: center; 
      gap: 0.5rem;
      padding: 0.5rem 1rem;
      background: var(--bg);
      border-radius: 9999px;
      font-size: 0.875rem;
    }
    .status-dot { width: 8px; height: 8px; border-radius: 50%; }
    .online { background: var(--success); }
    .offline { background: var(--danger); }
    
    /* Main Layout */
    .main {
      display: flex;
      height: calc(100vh - 70px);
    }
    
    /* Categories Sidebar */
    .sidebar {
      width: 180px;
      background: var(--card);
      padding: 1rem;
      overflow-y: auto;
      border-right: 1px solid var(--border);
    }
    .sidebar h3 { color: #9ca3af; font-size: 0.75rem; margin-bottom: 0.75rem; text-transform: uppercase; }
    .cat-btn {
      display: block;
      width: 100%;
      text-align: left;
      padding: 0.75rem 1rem;
      margin-bottom: 0.5rem;
      background: transparent;
      border: none;
      color: #fff;
      border-radius: 0.5rem;
      cursor: pointer;
      font-family: inherit;
      transition: all 0.2s;
    }
    .cat-btn:hover { background: var(--bg); }
    .cat-btn.active { background: var(--primary); }
    
    /* Products Grid */
    .products {
      flex: 1;
      padding: 1rem;
      overflow-y: auto;
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(140px, 1fr));
      gap: 1rem;
      align-content: start;
    }
    .product {
      background: var(--card);
      padding: 1rem;
      border-radius: 1rem;
      cursor: pointer;
      transition: all 0.2s;
      text-align: center;
    }
    .product:hover {
      transform: translateY(-2px);
      background: #1f2937;
    }
    .product.low-stock { border: 2px solid var(--danger); }
    .product-icon { font-size: 2.5rem; margin-bottom: 0.5rem; }
    .product-name { font-weight: 600; font-size: 0.875rem; margin-bottom: 0.25rem; }
    .product-price { color: var(--primary); font-weight: bold; }
    .product-stock { color: #9ca3af; font-size: 0.75rem; }
    
    /* Cart */
    .cart {
      width: 320px;
      background: var(--card);
      display: flex;
      flex-direction: column;
      border-left: 1px solid var(--border);
    }
    .cart-header {
      padding: 1rem;
      border-bottom: 1px solid var(--border);
      display: flex;
      justify-content: space-between;
      align-items: center;
    }
    .cart-header h3 { font-size: 1rem; }
    .clear-btn { color: var(--danger); font-size: 0.75rem; cursor: pointer; background: none; border: none; color: inherit; font-family: inherit; }
    .clear-btn:hover { text-decoration: underline; }
    
    .cart-items {
      flex: 1;
      overflow-y: auto;
      padding: 1rem;
    }
    .cart-empty {
      text-align: center;
      color: #9ca3af;
      padding: 3rem 0;
    }
    .cart-item {
      display: flex;
      align-items: center;
      gap: 0.75rem;
      padding: 0.75rem;
      background: var(--bg);
      border-radius: 0.75rem;
      margin-bottom: 0.75rem;
    }
    .cart-item-info { flex: 1; }
    .cart-item-name { font-size: 0.875rem; font-weight: 500; }
    .cart-item-price { font-size: 0.75rem; color: #9ca3af; }
    .qty-controls { display: flex; align-items: center; gap: 0.5rem; }
    .qty-btn {
      width: 28px; height: 28px;
      border: none; border-radius: 0.375rem;
      background: var(--border);
      color: #fff;
      cursor: pointer;
      font-size: 1rem;
      font-family: inherit;
    }
    .qty-btn:hover { background: var(--primary); }
    .cart-item-total { font-weight: bold; min-width: 60px; text-align: right; }
    
    .cart-footer {
      padding: 1rem;
      border-top: 1px solid var(--border);
    }
    .cart-summary { margin-bottom: 1rem; }
    .cart-row { display: flex; justify-content: space-between; padding: 0.25rem 0; }
    .cart-row.total { font-size: 1.25rem; font-weight: bold; border-top: 1px solid var(--border); padding-top: 0.75rem; margin-top: 0.5rem; }
    .checkout-btn {
      width: 100%;
      padding: 1rem;
      background: var(--success);
      border: none;
      border-radius: 0.75rem;
      color: #fff;
      font-size: 1.125rem;
      font-weight: bold;
      cursor: pointer;
      font-family: inherit;
      transition: all 0.2s;
    }
    .checkout-btn:hover { background: #16a34a; }
    .checkout-btn:disabled { background: var(--border); cursor: not-allowed; }
    
    /* Modal */
    .modal {
      position: fixed;
      inset: 0;
      background: rgba(0,0,0,0.7);
      display: flex;
      align-items: center;
      justify-content: center;
      z-index: 200;
    }
    .modal-content {
      background: var(--card);
      border-radius: 1.5rem;
      padding: 2rem;
      text-align: center;
      max-width: 400px;
      width: 90%;
    }
    .modal h2 { margin-bottom: 0.5rem; }
    .modal p { color: #9ca3af; margin-bottom: 1.5rem; }
    .modal-btn {
      padding: 0.75rem 2rem;
      background: var(--primary);
      border: none;
      border-radius: 0.5rem;
      color: #fff;
      font-weight: bold;
      cursor: pointer;
      font-family: inherit;
    }
    
    /* Search */
    .search-box {
      padding: 0.75rem 1.5rem;
      background: var(--card);
      border-bottom: 1px solid var(--border);
    }
    .search-input {
      width: 100%;
      padding: 0.75rem 1rem;
      background: var(--bg);
      border: 1px solid var(--border);
      border-radius: 9999px;
      color: #fff;
      font-family: inherit;
      font-size: 0.875rem;
    }
    .search-input:focus { outline: none; border-color: var(--primary); }
    
    /* Tabs */
    .tabs {
      display: flex;
      gap: 0.5rem;
      padding: 0.5rem;
      background: var(--card);
    }
    .tab {
      flex: 1;
      padding: 0.5rem;
      background: transparent;
      border: none;
      color: #9ca3af;
      cursor: pointer;
      border-radius: 0.5rem;
      font-family: inherit;
    }
    .tab.active { background: var(--primary); color: #fff; }
    
    /* Toast */
    .toast {
      position: fixed;
      bottom: 2rem;
      left: 50%;
      transform: translateX(-50%);
      background: var(--success);
      color: #fff;
      padding: 1rem 2rem;
      border-radius: 9999px;
      font-weight: 500;
      z-index: 300;
      animation: slideUp 0.3s ease;
    }
    @keyframes slideUp {
      from { transform: translateX(-50%) translateY(100px); opacity: 0; }
      to { transform: translateX(-50%) translateY(0); opacity: 1; }
    }
  </style>
</head>
<body>
  <header class="header">
    <div class="logo">💼 POS</div>
    <div class="status">
      <div class="status-dot online" id="statusDot"></div>
      <span id="statusText">অনলাইন</span>
    </div>
  </header>

  <div class="tabs">
    <button class="tab active" onclick="showPage('pos')">💼 POS</button>
    <button class="tab" onclick="showPage('dashboard')">📊 ড্যাশবোর্ড</button>
  </div>

  <!-- POS Page -->
  <div id="posPage" class="main">
    <aside class="sidebar">
      <h3>ক্যাটাগরি</h3>
      <button class="cat-btn active" onclick="filterCategory('all')">📦 সব পণ্য</button>
      <div id="categories"></div>
    </aside>

    <div style="flex: 1; display: flex; flex-direction: column;">
      <div class="search-box">
        <input type="text" class="search-input" placeholder="🔍 পণ্য খুঁজুন..." id="searchInput" oninput="filterProducts()">
      </div>
      <div class="products" id="products"></div>
    </div>

    <aside class="cart">
      <div class="cart-header">
        <h3>🛒 কার্ট (<span id="cartCount">0</span>)</h3>
        <button class="clear-btn" onclick="clearCart()">খালি করুন</button>
      </div>
      <div class="cart-items" id="cartItems">
        <div class="cart-empty">
          <div style="font-size: 3rem; margin-bottom: 1rem;">🛒</div>
          <p>কার্ট খালি</p>
        </div>
      </div>
      <div class="cart-footer">
        <div class="cart-summary">
          <div class="cart-row"><span>সাবটোটাল:</span><span id="subtotal">৳0</span></div>
          <div class="cart-row total"><span>মোট:</span><span id="total">৳0</span></div>
        </div>
        <button class="checkout-btn" id="checkoutBtn" onclick="checkout()" disabled>💰 পেমেন্ট করুন</button>
      </div>
    </aside>
  </div>

  <!-- Dashboard Page -->
  <div id="dashboardPage" style="display: none; padding: 1.5rem; overflow-y: auto; height: calc(100vh - 120px);">
    <div style="display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 1rem; margin-bottom: 2rem;">
      <div style="background: var(--card); padding: 1.5rem; border-radius: 1rem;">
        <div style="color: #9ca3af; font-size: 0.875rem;">আজকের বিক্রয়</div>
        <div style="font-size: 2rem; font-weight: bold; color: var(--success);" id="todaySales">৳0</div>
        <div style="color: #9ca3af; font-size: 0.875rem;"><span id="todayCount">0</span>টি লেনদেন</div>
      </div>
      <div style="background: var(--card); padding: 1.5rem; border-radius: 1rem;">
        <div style="color: #9ca3af; font-size: 0.875rem;">মোট পণ্য</div>
        <div style="font-size: 2rem; font-weight: bold; color: #3b82f6;" id="totalProducts">0</div>
      </div>
      <div style="background: var(--card); padding: 1.5rem; border-radius: 1rem;">
        <div style="color: #9ca3af; font-size: 0.875rem;">মোট বিক্রয়</div>
        <div style="font-size: 2rem; font-weight: bold; color: var(--warning);" id="allTimeSales">৳0</div>
      </div>
      <div style="background: var(--card); padding: 1.5rem; border-radius: 1rem;">
        <div style="color: #9ca3af; font-size: 0.875rem;">কম স্টক</div>
        <div style="font-size: 2rem; font-weight: bold; color: var(--danger);" id="lowStock">0</div>
      </div>
    </div>

    <div style="background: var(--card); border-radius: 1rem; padding: 1.5rem;">
      <h3 style="margin-bottom: 1rem;">📋 সাম্প্রতিক বিক্রয়</h3>
      <div id="recentSales">
        <p style="color: #9ca3af;">কোনো বিক্রয় নেই</p>
      </div>
    </div>
  </div>

  <!-- Success Modal -->
  <div class="modal" id="successModal" style="display: none;">
    <div class="modal-content">
      <div style="font-size: 4rem; margin-bottom: 1rem;">✅</div>
      <h2>বিক্রয় সম্পন্ন!</h2>
      <p id="invoiceNo">Invoice: INV001</p>
      <div id="receiptItems" style="text-align: left; background: var(--bg); padding: 1rem; border-radius: 0.5rem; margin-bottom: 1rem; max-height: 200px; overflow-y: auto;"></div>
      <button class="modal-btn" onclick="closeModal()">✓ সম্পন্ন</button>
    </div>
  </div>

  <script>
    // =====================
    // DATA & STATE
    // =====================
    const DB_NAME = 'pos_offline_db';
    const STORE_NAME = 'pos_data';
    let db = null;
    let cart = [];
    let products = [];
    let categories = [];
    let sales = [];

    // Initial Demo Data
    const DEMO_CATEGORIES = [
      { id: 'cat-food', name: 'খাবার', icon: '🍔' },
      { id: 'cat-drinks', name: 'পানীয়', icon: '🥤' },
      { id: 'cat-essentials', name: 'প্রয়োজনীয়', icon: '🛒' },
    ];

    const DEMO_PRODUCTS = [
      { id: 1, name: 'সাদা ভাত', code: 'RICE001', price: 120, stock: 50, cat: 'cat-food', icon: '🍚' },
      { id: 2, name: 'পোলাও', code: 'RICE002', price: 150, stock: 30, cat: 'cat-food', icon: '🍛' },
      { id: 3, name: 'চিকেন কর্ন', code: 'CHK001', price: 200, stock: 25, cat: 'cat-food', icon: '🍗' },
      { id: 4, name: 'ফ্রাইড রাইস', code: 'FR001', price: 130, stock: 40, cat: 'cat-food', icon: '🍜' },
      { id: 5, name: 'সসেজ', code: 'SAG001', price: 80, stock: 60, cat: 'cat-food', icon: '🌭' },
      { id: 6, name: 'কোকা কোলা', code: 'COKE001', price: 30, stock: 100, cat: 'cat-drinks', icon: '🥤' },
      { id: 7, name: 'পেপসি', code: 'PEP001', price: 25, stock: 80, cat: 'cat-drinks', icon: '🥤' },
      { id: 8, name: 'স্প্রাইট', code: 'SPR001', price: 25, stock: 75, cat: 'cat-drinks', icon: '🥤' },
      { id: 9, name: 'মিনারেল ওয়াটার', code: 'MIN001', price: 20, stock: 150, cat: 'cat-drinks', icon: '💧' },
      { id: 10, name: 'চা', code: 'TEA001', price: 15, stock: 200, cat: 'cat-drinks', icon: '☕' },
      { id: 11, name: 'সাবান', code: 'SOAP001', price: 45, stock: 50, cat: 'cat-essentials', icon: '🧼' },
      { id: 12, name: 'শ্যাম্পু', code: 'SHAM001', price: 150, stock: 30, cat: 'cat-essentials', icon: '🧴' },
      { id: 13, name: 'টুথপেস্ট', code: 'TP001', price: 85, stock: 5, cat: 'cat-essentials', icon: '🪥' },
      { id: 14, name: 'পারফিউম', code: 'PERF001', price: 350, stock: 15, cat: 'cat-essentials', icon: '🌸' },
      { id: 15, name: 'স্মোকিং বিয়ার', code: 'SMO001', price: 10, stock: 3, cat: 'cat-essentials', icon: '🧴' },
    ];

    // =====================
    // DATABASE
    // =====================
    function initDB() {
      return new Promise((resolve, reject) => {
        const request = indexedDB.open(DB_NAME, 1);
        request.onerror = () => reject(request.error);
        request.onsuccess = () => { db = request.result; resolve(db); };
        request.onupgradeneeded = (e) => {
          const database = e.target.result;
          if (!database.objectStoreNames.contains('products')) {
            database.createObjectStore('products', { keyPath: 'id' });
          }
          if (!database.objectStoreNames.contains('sales')) {
            database.createObjectStore('sales', { keyPath: 'id', autoIncrement: true });
          }
          if (!database.objectStoreNames.contains('settings')) {
            database.createObjectStore('settings', { keyPath: 'key' });
          }
        };
      });
    }

    async function saveData(store, data) {
      return new Promise((resolve, reject) => {
        const tx = db.transaction(store, 'readwrite');
        const objectStore = tx.objectStore(store);
        if (Array.isArray(data)) {
          data.forEach(item => objectStore.put(item));
        } else {
          objectStore.put(data);
        }
        tx.oncomplete = () => resolve();
        tx.onerror = () => reject(tx.error);
      });
    }

    async function loadData(store) {
      return new Promise((resolve, reject) => {
        const tx = db.transaction(store, 'readonly');
        const objectStore = tx.objectStore(store);
        const request = objectStore.getAll();
        request.onsuccess = () => resolve(request.result);
        request.onerror = () => reject(request.error);
      });
    }

    // =====================
    // UI FUNCTIONS
    // =====================
    function renderCategories() {
      const container = document.getElementById('categories');
      container.innerHTML = categories.map(cat => `
        <button class="cat-btn" onclick="filterCategory('${cat.id}')">${cat.icon} ${cat.name}</button>
      `).join('');
    }

    function renderProducts() {
      const container = document.getElementById('products');
      container.innerHTML = products.map(p => `
        <div class="product ${p.stock <= 10 ? 'low-stock' : ''}" onclick="addToCart(${p.id})">
          <div class="product-icon">${p.icon}</div>
          <div class="product-name">${p.name}</div>
          <div class="product-price">৳${p.price}</div>
          <div class="product-stock">স্টক: ${p.stock}</div>
        </div>
      `).join('');
    }

    function renderCart() {
      const container = document.getElementById('cartItems');
      const countEl = document.getElementById('cartCount');
      const checkoutBtn = document.getElementById('checkoutBtn');
      const subtotalEl = document.getElementById('subtotal');
      const totalEl = document.getElementById('total');

      if (cart.length === 0) {
        container.innerHTML = `
          <div class="cart-empty">
            <div style="font-size: 3rem; margin-bottom: 1rem;">🛒</div>
            <p>কার্ট খালি</p>
          </div>
        `;
        countEl.textContent = '0';
        subtotalEl.textContent = '৳0';
        totalEl.textContent = '৳0';
        checkoutBtn.disabled = true;
        return;
      }

      container.innerHTML = cart.map(item => `
        <div class="cart-item">
          <div class="cart-item-info">
            <div class="cart-item-name">${item.name}</div>
            <div class="cart-item-price">৳${item.price}</div>
          </div>
          <div class="qty-controls">
            <button class="qty-btn" onclick="updateQty(${item.id}, -1)">-</button>
            <span>${item.qty}</span>
            <button class="qty-btn" onclick="updateQty(${item.id}, 1)">+</button>
          </div>
          <div class="cart-item-total">৳${item.price * item.qty}</div>
        </div>
      `).join('');

      const subtotal = cart.reduce((sum, item) => sum + (item.price * item.qty), 0);
      countEl.textContent = cart.reduce((sum, item) => sum + item.qty, 0);
      subtotalEl.textContent = `৳${subtotal}`;
      totalEl.textContent = `৳${subtotal}`;
      checkoutBtn.disabled = false;
    }

    function renderDashboard() {
      const today = new Date().toDateString();
      const todaySales = sales.filter(s => new Date(s.date).toDateString() === today);
      const todayTotal = todaySales.reduce((sum, s) => sum + s.total, 0);
      const lowStockCount = products.filter(p => p.stock <= 10).length;
      const allTimeTotal = sales.reduce((sum, s) => sum + s.total, 0);

      document.getElementById('todaySales').textContent = `৳${todayTotal}`;
      document.getElementById('todayCount').textContent = todaySales.length;
      document.getElementById('totalProducts').textContent = products.length;
      document.getElementById('allTimeSales').textContent = `৳${allTimeTotal}`;
      document.getElementById('lowStock').textContent = lowStockCount;

      const recentContainer = document.getElementById('recentSales');
      if (sales.length === 0) {
        recentContainer.innerHTML = '<p style="color: #9ca3af;">কোনো বিক্রয় নেই</p>';
      } else {
        recentContainer.innerHTML = sales.slice(0, 5).map(sale => `
          <div style="display: flex; justify-content: space-between; padding: 0.75rem; background: var(--bg); border-radius: 0.5rem; margin-bottom: 0.5rem;">
            <div>
              <div style="font-weight: 500;">${sale.invoice}</div>
              <div style="font-size: 0.75rem; color: #9ca3af;">${new Date(sale.date).toLocaleDateString('bn-BD')}</div>
            </div>
            <div style="color: var(--success); font-weight: bold;">৳${sale.total}</div>
          </div>
        `).join('');
      }
    }

    // =====================
    // ACTIONS
    // =====================
    function addToCart(id) {
      const product = products.find(p => p.id === id);
      if (!product || product.stock <= 0) return;

      const existing = cart.find(item => item.id === id);
      if (existing) {
        if (existing.qty >= product.stock) return;
        existing.qty++;
      } else {
        cart.push({ id: product.id, name: product.name, price: product.price, qty: 1 });
      }
      renderCart();
    }

    function updateQty(id, change) {
      const item = cart.find(i => i.id === id);
      if (!item) return;

      const product = products.find(p => p.id === id);
      const newQty = item.qty + change;

      if (newQty <= 0) {
        cart = cart.filter(i => i.id !== id);
      } else if (newQty <= product.stock) {
        item.qty = newQty;
      }
      renderCart();
    }

    function clearCart() {
      cart = [];
      renderCart();
    }

    function filterCategory(catId) {
      document.querySelectorAll('.cat-btn').forEach(btn => btn.classList.remove('active'));
      event.target.classList.add('active');

      if (catId === 'all') {
        renderProducts();
      } else {
        const filtered = products.filter(p => p.cat === catId);
        const container = document.getElementById('products');
        container.innerHTML = filtered.map(p => `
          <div class="product ${p.stock <= 10 ? 'low-stock' : ''}" onclick="addToCart(${p.id})">
            <div class="product-icon">${p.icon}</div>
            <div class="product-name">${p.name}</div>
            <div class="product-price">৳${p.price}</div>
            <div class="product-stock">স্টক: ${p.stock}</div>
          </div>
        `).join('');
      }
    }

    function filterProducts() {
      const query = document.getElementById('searchInput').value.toLowerCase();
      const filtered = products.filter(p => 
        p.name.toLowerCase().includes(query) || p.code.toLowerCase().includes(query)
      );
      const container = document.getElementById('products');
      container.innerHTML = filtered.map(p => `
        <div class="product ${p.stock <= 10 ? 'low-stock' : ''}" onclick="addToCart(${p.id})">
          <div class="product-icon">${p.icon}</div>
          <div class="product-name">${p.name}</div>
          <div class="product-price">৳${p.price}</div>
          <div class="product-stock">স্টক: ${p.stock}</div>
        </div>
      `).join('');
    }

    async function checkout() {
      if (cart.length === 0) return;

      const invoiceNo = `INV${Date.now().toString().slice(-6)}`;
      const total = cart.reduce((sum, item) => sum + (item.price * item.qty), 0);

      // Update stock
      cart.forEach(item => {
        const product = products.find(p => p.id === item.id);
        if (product) {
          product.stock -= item.qty;
        }
      });

      // Save sale
      const sale = {
        invoice: invoiceNo,
        date: new Date().toISOString(),
        items: [...cart],
        total,
        paid: total,
        change: 0
      };
      sales.unshift(sale);
      await saveData('sales', sales);
      await saveData('products', products);

      // Show receipt
      document.getElementById('invoiceNo').textContent = `Invoice: ${invoiceNo}`;
      document.getElementById('receiptItems').innerHTML = sale.items.map(item => `
        <div style="display: flex; justify-content: space-between; padding: 0.25rem 0;">
          <span>${item.name} × ${item.qty}</span>
          <span>৳${item.price * item.qty}</span>
        </div>
      `).join('');
      document.getElementById('successModal').style.display = 'flex';

      // Clear cart
      cart = [];
      renderCart();
      renderProducts();
      renderDashboard();
    }

    function closeModal() {
      document.getElementById('successModal').style.display = 'none';
    }

    function showPage(page) {
      document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
      event.target.classList.add('active');
      
      document.getElementById('posPage').style.display = page === 'pos' ? 'flex' : 'none';
      document.getElementById('dashboardPage').style.display = page === 'dashboard' ? 'block' : 'none';
      
      if (page === 'dashboard') renderDashboard();
    }

    // Online/Offline status
    function updateOnlineStatus() {
      const isOnline = navigator.onLine;
      document.getElementById('statusDot').className = `status-dot ${isOnline ? 'online' : 'offline'}`;
      document.getElementById('statusText').textContent = isOnline ? 'অনলাইন' : 'অফলাইন';
    }
    window.addEventListener('online', updateOnlineStatus);
    window.addEventListener('offline', updateOnlineStatus);

    // =====================
    // INIT
    // =====================
    async function init() {
      await initDB();

      // Load or init data
      let savedProducts = await loadData('products');
      let savedSales = await loadData('sales');

      if (savedProducts.length === 0) {
        categories = [...DEMO_CATEGORIES];
        products = DEMO_PRODUCTS.map(p => ({ ...p }));
        await saveData('products', products);
      } else {
        products = savedProducts;
        categories = [...DEMO_CATEGORIES];
      }

      if (savedSales.length > 0) {
        sales = savedSales;
      }

      renderCategories();
      renderProducts();
      renderDashboard();
      updateOnlineStatus();
    }

    init();
  </script>
</body>
</html>
