<!doctype html>
<html lang="bn">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="POS সিস্টেম - বিক্রয়, স্টক ও হিসাব ব্যবস্থা" />
    <title>POS সিস্টেম</title>
    <link rel="icon" type="image/svg+xml" href="./favicon.svg" />
    <style>
      * { margin: 0; padding: 0; box-sizing: border-box; }
      body { font-family: system-ui, -apple-system, sans-serif; }
      #root:empty {
        display: none;
      }
      @keyframes preloader-spin {
        0% { transform: rotate(0deg); }
        100% { transform: rotate(360deg); }
      }
      @keyframes preloader-pulse {
        0%, 100% { opacity: 1; }
        50% { opacity: 0.6; }
      }
    </style>
  </head>
  <body>
    <div style="position:fixed;inset:0;background:#0F766E;display:flex;align-items:center;justify-content:center;z-index:9999" id="preloader">
      <div style="width:120px;height:120px;position:relative;display:flex;align-items:center;justify-content:center">
        <div style="position:absolute;width:120px;height:120px;border-radius:50%;border:4px solid rgba(255,255,255,0.2);border-top-color:#ffffff;animation:preloader-spin 1s linear infinite"></div>
        <div style="font-size:50px;animation:preloader-pulse 1.5s ease-in-out infinite">🏪</div>
      </div>
    </div>
    <div id="root"></div>
  </body>
</html>
