<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0F766E"/>
      <stop offset="100%" style="stop-color:#0D9488"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#00000033"/>
    </filter>
  </defs>
  <!-- Main rounded square with gradient -->
  <rect x="24" y="24" width="464" height="464" rx="100" fill="url(#grad)" filter="url(#shadow)"/>
  <!-- Inner subtle border -->
  <rect x="28" y="28" width="456" height="456" rx="96" fill="none" stroke="#ffffff" stroke-width="4" opacity="0.15"/>
  <!-- Store emoji -->
  <text x="256" y="340" font-size="280" text-anchor="middle">🏪</text>
</svg>
