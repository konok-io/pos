<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0F766E"/>
      <stop offset="100%" style="stop-color:#14B8A6"/>
    </linearGradient>
    <linearGradient id="screen" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#1E293B"/>
      <stop offset="100%" style="stop-color:#0F172A"/>
    </linearGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
  
  <!-- Background -->
  <rect width="512" height="512" rx="110" fill="url(#bg)"/>
  
  <!-- Cash Register Body -->
  <rect x="100" y="280" width="312" height="160" rx="20" fill="#F8FAFC"/>
  
  <!-- Screen -->
  <rect x="130" y="160" width="140" height="100" rx="12" fill="url(#screen)"/>
  <rect x="140" y="170" width="120" height="80" rx="8" fill="#064E3B"/>
  
  <!-- Screen Text Lines -->
  <rect x="150" y="185" width="60" height="8" rx="4" fill="#34D399"/>
  <rect x="150" y="205" width="80" height="6" rx="3" fill="#6EE7B7"/>
  <rect x="150" y="220" width="50" height="6" rx="3" fill="#6EE7B7"/>
  <rect x="150" y="235" width="70" height="6" rx="3" fill="#34D399"/>
  
  <!-- Dollar Sign on Screen -->
  <text x="230" y="210" font-family="Arial, sans-serif" font-size="28" font-weight="bold" fill="#10B981" text-anchor="middle">৳</text>
  
  <!-- Receipt -->
  <rect x="285" y="145" width="80" height="120" rx="4" fill="#FFFFFF"/>
  <rect x="295" y="155" width="60" height="4" rx="2" fill="#CBD5E1"/>
  <rect x="295" y="167" width="50" height="4" rx="2" fill="#CBD5E1"/>
  <rect x="295" y="179" width="55" height="4" rx="2" fill="#CBD5E1"/>
  <rect x="295" y="191" width="45" height="4" rx="2" fill="#CBD5E1"/>
  <rect x="295" y="203" width="55" height="4" rx="2" fill="#CBD5E1"/>
  <rect x="295" y="220" width="60" height="6" rx="3" fill="#0F766E"/>
  <rect x="295" y="235" width="40" height="6" rx="3" fill="#0F766E"/>
  
  <!-- Buttons Row 1 -->
  <rect x="130" y="300" width="30" height="20" rx="4" fill="#3B82F6"/>
  <rect x="170" y="300" width="30" height="20" rx="4" fill="#EF4444"/>
  <rect x="210" y="300" width="30" height="20" rx="4" fill="#F59E0B"/>
  <rect x="250" y="300" width="30" height="20" rx="4" fill="#10B981"/>
  
  <!-- Buttons Row 2 -->
  <rect x="130" y="330" width="30" height="20" rx="4" fill="#8B5CF6"/>
  <rect x="170" y="330" width="30" height="20" rx="4" fill="#EC4899"/>
  <rect x="210" y="330" width="30" height="20" rx="4" fill="#06B6D4"/>
  <rect x="250" y="330" width="30" height="20" rx="4" fill="#84CC16"/>
  
  <!-- Cash Drawer -->
  <rect x="130" y="370" width="252" height="50" rx="8" fill="#E2E8F0"/>
  <rect x="150" y="385" width="80" height="20" rx="4" fill="#94A3B8"/>
  <rect x="380" y="395" width="20" height="8" rx="2" fill="#64748B"/>
  
  <!-- POS Letters -->
  <text x="340" y="400" font-family="Arial, sans-serif" font-size="42" font-weight="bold" fill="#0F766E" text-anchor="middle" filter="url(#glow)">POS</text>
  
  <!-- Bottom accent line -->
  <rect x="100" y="430" width="312" height="10" rx="5" fill="#0D9488"/>
</svg>
