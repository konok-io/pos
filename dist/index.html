<!doctype html>
<html lang="bn">

    <title>POS সিস্টেম</title>

    <style>
      @font-face {
        font-family: 'Bangla';
        src: url('./fonts/bangla.ttf') format('truetype');
        font-weight: normal;
        font-style: normal;
      }
      
      * { margin: 0; padding: 0; box-sizing: border-box; }
      html, body { margin: 0; padding: 0; height: 100%; overflow: hidden; }
      
      #preloader {
        position: fixed;
        inset: 0;
        background: #0F766E;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        z-index: 9999;
        transition: opacity 0.4s ease-out;
      }
      #preloader.hidden {
        opacity: 0;
        pointer-events: none;
      }
      #preloader .spinner {
        width: 50px;
        height: 50px;
        border: 4px solid rgba(255,255,255,0.2);
        border-top-color: #fff;
        border-radius: 50%;
        animation: spin 1s linear infinite;
      }
      #preloader .text {
        color: white;
        margin-top: 20px;
        font-family: 'Bangla', sans-serif;
        font-size: 18px;
        font-weight: 600;
      }
      @keyframes spin {
        to { transform: rotate(360deg); }
      }
    </style>
