        left: 50%;
        transform: translate(-50%, -50%);

        height: 36px !important;
      }
      #preloader-text {
        text-align: center;
        margin-top: 16px;
      }
      #preloader-text h3 {
        color: #ffffff;
        font-size: 18px;
        font-weight: 700;

      }
