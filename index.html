<!doctype html>
<html lang="bn">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="POS সিস্টেম - বিক্রয়, স্টক ও হিসাব ব্যবস্থা" />
    <title>POS সিস্টেম</title>
    <link rel="icon" type="image/svg+xml" href="./favicon.svg" />
    <style>
      * { margin: 0; padding: 0; box-sizing: border-box; }
      body { font-family: system-ui, -apple-system, sans-serif; }
      #preloader {
        position: fixed;
        inset: 0;
        background: #0F766E;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 24px;
        z-index: 9999;
      }
      #preloader.hidden {
        display: none;
      }
      @keyframes pulse {
        0%, 100% { transform: scale(1); opacity: 1; }
        50% { transform: scale(1.1); opacity: 0.8; }
      }
      #root:empty {
        display: none;
      }
      /* Preloader font sizes - highest priority */
      body #preloader > div:first-child { font-size: 60px !important; }
      body #preloader > div:nth-child(2) { font-size: 48px !important; font-weight: 700 !important; color: white !important; }
      body #preloader > div:nth-child(3) { font-size: 22px !important; color: rgba(255,255,255,0.8) !important; }
    </style>
  </head>
  <body>
    <div id="preloader">
      <div>🏪</div>
      <div>POS সিস্টেম</div>
      <div>লোড হচ্ছে...</div>
    </div>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
