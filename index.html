<!doctype html>
<html lang="bn">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="POS সিস্টেম - বিক্রয়, স্টক ও হিসাব ব্যবস্থা" />
    <title>POS সিস্টেম</title>
    <link rel="icon" type="image/svg+xml" href="./favicon.svg" />
    <style>
      * { margin: 0; padding: 0; box-sizing: border-box; }
      html, body { margin: 0; padding: 0; height: 100%; overflow: hidden; }
      
      /* Preloader - prevents FOUC */
      #preloader {
        position: fixed;
        inset: 0;
        background: linear-gradient(135deg, #0F766E 0%, #115E59 100%);
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        z-index: 9999;
        transition: opacity 0.4s ease-out;
      }
      #preloader.hidden {
        opacity: 0;
        pointer-events: none;
      }
      #preloader .spinner {
        width: 50px;
        height: 50px;
        border: 4px solid rgba(255,255,255,0.2);
        border-top-color: #fff;
        border-radius: 50%;
        animation: spin 1s linear infinite;
      }
      #preloader .text {
        color: white;
        margin-top: 20px;
        font-family: 'Noto Sans Bengali', 'Hind Siliguri', 'Bangla', system-ui, sans-serif;
        font-size: 18px;
        font-weight: 600;
      }
      @keyframes spin {
        to { transform: rotate(360deg); }
      }
    </style>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+Bengali:wght@400;500;600;700&display=swap" rel="stylesheet">
  </head>
  <body>
    <div id="preloader">
      <div class="spinner"></div>
      <div class="text">POS সিস্টেম লোড হচ্ছে...</div>
    </div>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
    <script>
      // Hide preloader when app is ready
      window.addEventListener('load', function() {
        setTimeout(function() {
          var preloader = document.getElementById('preloader');
          if (preloader) preloader.classList.add('hidden');
          setTimeout(function() {
            if (preloader && preloader.parentNode) preloader.parentNode.removeChild(preloader);
          }, 400);
        }, 100);
      });
    </script>
  </body>
</html>
